name: E2E

on: pull_request

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/jod

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # The runner has no audio output, and without one Firefox never starts an AudioContext:
      # the tests that count the sounds of the 8-bit skin fail there. PulseAudio gives it a null
      # sink. Chromium and WebKit run a context without it.
      - run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pulseaudio --check
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/jod

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Shared runners vary by a few points; the acceptance threshold of 95 is checked locally.
      - run: npm run audit -- --min=90
